# Survival OS: drivers cargados al arrancar, haya o no dispositivo enchufado.
# survival-mesh, survival-esp32-gateway y survival-ups usan DeviceAllow=char-ttyACM/char-ttyUSB/char-i2c,
# que systemd resuelve en /proc/devices al arrancar la unidad: sin el driver cargado, el permiso queda vacío
# y el dispositivo da PermissionError hasta reiniciar el servicio.
cdc_acm
usbserial
i2c-dev
