# Survival OS — directorios en /run (tmpfs). Instalado en /etc/tmpfiles.d/.
d /run/survival-os 0755 root root -
# FIFO del agente del kiosco: lo lee el usuario de escritorio, lo escribe el grupo survival.
p /run/survival-os/kiosk.fifo 0620 @KIOSK_USER@ survival -
# Peticiones de mantenimiento: la web (survival) escribe <tarea>.json; root escribe registros 0644.
d /run/survival-os/admin 0770 root survival -
